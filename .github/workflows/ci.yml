name: infoapex-ai CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  clean-clone:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Infoapex AI bundle
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x

      - name: Install bundle dependencies
        run: npm run setup

      - name: Validate Infoapex AI boundary and installer
        run: |
          npm run check:provenance
          npm run check:generic-boundary
          npm test

      - name: Run planner tests and JSON validation
        run: npm test --prefix modules/ai-code-planner

      - name: Run worker tests and JSON validation
        run: npm test --prefix modules/ai-code-worker

      - name: Run review tests and JSON validation
        run: npm test --prefix modules/ai-code-review

      - name: Run docs tests and JSON validation
        run: npm test --prefix modules/ai-code-docs

      - name: Run benchmark tests, contracts, recovery, and security validation
        run: npm test --prefix modules/ai-code-benchmark

      - name: Run hermetic BENCH-D deterministic harness
        run: npm run benchmark:deterministic --prefix modules/ai-code-benchmark

      - name: Run internal review gate
        run: npm run review-gate:internal

      - name: Run internal docs gate
        run: npm run docs-gate:internal

      - name: Run internal three-plan value gate
        run: npm run value-gate:internal

      - name: Build and test control
        run: |
          dotnet test modules/ai-code-control/tools/ai-code-control/AiCodeControl.sln --nologo
          npm run build --prefix modules/ai-code-control/tools/ai-code-control/mcp-server

      - name: P3 release smoke test (git-archive ZIP -> clean extract -> setup/build/test -> all gates -> installer both modes)
        run: npm run release:smoke-test

      - name: P6 core-local contract, security, operations and compatibility gate
        run: npm run p6:verify
